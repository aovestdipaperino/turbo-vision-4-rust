# Netlify build for the Turbo Vision documentation site.
# Set the site's "Base directory" to `website` in the Netlify UI; this file is
# then read from that directory and the paths below are relative to it.

[build]
  command = "pip install -r requirements.txt && mkdocs build --site-dir site"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.12"

# Screenshots and the box photo rarely change under the same name, but a
# header rule also stamps the 404 served when one is missing: `immutable`
# here once pinned a year-long "this image does not exist" into every visitor's
# cache. A week is long enough to be worth caching and short enough to recover.
[[headers]]
  for = "/assets/captures/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Stylesheets and scripts must be revalidated, or a redeploy never reaches
# browsers that already hold a copy.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
